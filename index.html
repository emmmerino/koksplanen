<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d6a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Köksplanen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Köksplanen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobilförst, en kolumn med flikar i botten; varje flik är en arbetsyta, inte en sida att läsa. */
:root{
  --bg:#f2f4ef; --surface:#ffffff; --sunk:#e8ece5; --ink:#1c2822; --muted:#5d6c64; --line:#d9e0d8;
  --accent:#2d6a4d; --accent-ink:#ffffff; --accent-soft:#dcebe2; --mark:#e6b52e; --mark-soft:#f8ecc6; --mark-ink:#4a3a08;
  --done:#98a49d; --danger:#b23a2e;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#19211d; --sunk:#151c18; --ink:#e4ebe6; --muted:#9aa9a1; --line:#2a3530;
  --accent:#6dbd92; --accent-ink:#0d1912; --accent-soft:#1f3329; --mark:#e0b43f; --mark-soft:#3a3016; --mark-ink:#f6e3a6;
  --done:#5c6a62; --danger:#e57366; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211d; --sunk:#151c18; --ink:#e4ebe6; --muted:#9aa9a1; --line:#2a3530;
  --accent:#6dbd92; --accent-ink:#0d1912; --accent-soft:#1f3329; --mark:#e0b43f; --mark-soft:#3a3016; --mark-ink:#f6e3a6;
  --done:#5c6a62; --danger:#e57366; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:420px;margin:0 auto;text-align:left}
.login h1{font-size:2.6rem}
.login p{color:var(--muted);margin:0}
.who{margin-top:28px;color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}

header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font:800 1.9rem/1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font:700 1.25rem/1.15 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem}
.banner{background:var(--mark-soft);color:var(--mark-ink);border-radius:var(--r);padding:10px 12px;font-size:.92rem;margin-bottom:12px}

/* Bottenflikar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-weight:600;font-size:.8rem}
nav.tabs button svg{width:24px;height:24px}
.who-pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.who-pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem;color:var(--ink)}
.who-pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#wishFilter button{padding:5px 10px;font-size:.82rem;font-weight:500}
#wishFilter{gap:4px}
.who-pick .lbl{align-self:center;font-size:.8rem;color:var(--muted);margin-right:2px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.7rem;line-height:18px;margin-left:4px}

/* Formulär */
.addrow{display:flex;gap:8px}
.field{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.field:focus{outline:2px solid var(--accent);outline-offset:-1px}
select.field{flex:0 0 auto;max-width:42%}
.btn{border:0;border-radius:var(--r);padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:.88rem}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;color:var(--ink)}
.chip:active{background:var(--accent-soft)}

/* Handlingslista */
.group{margin-top:18px}
.group h3{font:600 .75rem/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 6px 2px;display:flex;justify-content:space-between}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.tick{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);background:transparent;display:grid;place-items:center;padding:0}
.tick svg{width:15px;height:15px;opacity:0}
.item.done .tick{background:var(--done);border-color:var(--done)}
.item.done .tick svg{opacity:1;color:var(--surface)}
.item .txt{flex:1;min-width:0;cursor:pointer}
.item .name{font-weight:600;overflow-wrap:anywhere}
.item .meta{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.item.done .name{text-decoration:line-through;color:var(--done);font-weight:500}
.x{flex:0 0 auto;border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:1.2rem;line-height:1}
.x:hover{background:var(--sunk)}
.empty{text-align:center;color:var(--muted);padding:34px 16px;border:1px dashed var(--line);border-radius:var(--r);margin-top:18px}
.empty strong{display:block;color:var(--ink);font:700 1.1rem var(--display);margin-bottom:4px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:6px;background:var(--mark-soft);color:var(--mark-ink);vertical-align:1px;margin-left:6px}

/* Veckomeny */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.weeknav .lbl{font-weight:700;text-align:center;flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.day{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day.today{background:var(--accent-soft)}
.dlabel{display:flex;flex-direction:column;line-height:1.1}
.dlabel b{font:700 1.05rem var(--display)}
.dlabel span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meals{display:flex;flex-direction:column;gap:6px;min-width:0}
.meal{display:flex;align-items:center;gap:8px;min-width:0}
.meal .k{flex:0 0 52px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.slot{flex:1;min-width:0;text-align:left;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 10px;color:var(--muted);overflow-wrap:anywhere}
.slot.set{border-style:solid;border-color:transparent;background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.slot.rester{background:var(--mark-soft);color:var(--mark-ink);box-shadow:none}
.rq{flex:0 0 auto;border:1px solid var(--mark);background:transparent;color:var(--ink);border-radius:999px;padding:6px 10px;font-size:.8rem;font-weight:600}
.rq[aria-pressed="true"]{background:var(--mark);color:#2b2205}

.panel{margin-top:22px}
.panel .head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.ing{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.ing:first-child{border-top:0}
.ing input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:0 0 auto}
.ing .t{flex:1;min-width:0}
.ing .amt{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.ing .why{font-size:.75rem;color:var(--muted)}
.ing.off .t{opacity:.6}

/* Rätter */
.dish{display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--line);cursor:pointer}
.dish:first-child{border-top:0}
.dish .t{flex:1;min-width:0}
.dish .n{font-weight:600}
.dish .i{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.price{flex:0 0 auto;border:0;background:var(--sunk);color:var(--ink);border-radius:8px;padding:5px 9px;font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.price.none{background:transparent;color:var(--muted);font-weight:500;border:1px dashed var(--line)}
.item.done .price{color:var(--done)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;margin-top:14px}
.total b{font:700 1.25rem var(--display);font-variant-numeric:tabular-nums}
.total span{font-size:.85rem;color:var(--muted)}
.addrow .pricein{flex:0 0 92px;min-width:0}
.stars{letter-spacing:1px;font-size:.85rem;white-space:nowrap}
.stars.health{color:var(--accent)}
.stars.taste{color:var(--mark)}
.stars .off{color:var(--line)}
.rate{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted);margin-top:3px;align-items:center}
.rate > span{display:inline-flex;gap:4px;align-items:center}
.starpick{display:flex;gap:2px}
.starpick button{border:0;background:none;font-size:1.9rem;line-height:1;padding:2px 4px;color:var(--line)}
.starpick button.on{color:var(--mark)}
.sortsel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:.85rem}
.ing .have{flex:0 0 auto;align-self:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:.78rem;font-weight:600;color:var(--ink)}
.ing .have[aria-pressed="true"]{background:var(--sunk);color:var(--muted);border-color:transparent}
.ing.got .t b{text-decoration:line-through;color:var(--muted)}
.pairs{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface)}
.pairs h3{font:600 .75rem/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px}
.pairs .opts{display:flex;flex-direction:column;gap:6px}
.pairs button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:0;background:var(--accent-soft);border-radius:10px;padding:9px 12px;color:var(--ink)}
.pairs button small{color:var(--muted);font-size:.78rem;display:block}
.pairs button .add{flex:0 0 auto;font-weight:700;color:var(--accent);font-size:.85rem}
.dish.pair{background:var(--accent-soft)}
.shared{font-size:.78rem;color:var(--accent);font-weight:600;margin-top:2px}
.pkhead{font:600 .72rem/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:10px 12px 6px;border-top:1px solid var(--line)}
.pkhead:first-child{border-top:0}
.havebox{margin-top:10px}
.havebox summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:.9rem;padding:8px 2px}
.havebox .list{margin-top:4px}
.est{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.est details summary{cursor:pointer}
.est details .hint{margin-top:4px;line-height:1.6}

/* Ark (bottom sheet) */
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;
  padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:10px}
label.l{font-size:.8rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
textarea.field{min-height:180px;resize:vertical;width:100%;line-height:1.5}
.hint{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:60;max-width:90%;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>


<div class="wrap login" id="login" hidden>
  <h1>Köksplanen</h1>
  <p id="loginMsg">Familjens handlingslista och veckomeny. Logga in med ditt Google-konto för att se er gemensamma lista.</p>
  <div><button class="btn" id="loginBtn">Logga in med Google</button></div>
</div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <h1 id="viewTitle">Handla</h1>
    <span class="sub" id="syncState">Ansluter…</span>
  </header>
  <div class="banner" id="offline" hidden></div>

  <!-- HANDLA -->
  <section id="v-shop">
    <form class="addrow" id="addForm" autocomplete="off">
      <input class="field" id="addName" placeholder="Vad behöver köpas?" aria-label="Vara" enterkeyhint="done">
      <select class="field" id="addCat" aria-label="Kategori"></select>
      <button class="btn" id="addBtn" type="submit">Lägg till</button>
    </form>
    <div class="chips" id="quick"></div>
    <div id="shopList"></div>
  </section>

  <!-- STÖRRE KÖP -->
  <section id="v-wish" hidden>
    <form class="addrow" id="wishForm" autocomplete="off">
      <input class="field" id="wishName" placeholder="Vad behöver köpas?" aria-label="Sak att köpa" enterkeyhint="done">
      <input class="field pricein" id="wishPrice" type="number" inputmode="numeric" min="0" step="1" placeholder="Kr" aria-label="Ungefärligt pris i kronor">
      <button class="btn" type="submit">Lägg till</button>
    </form>
    <div class="who-pick" id="wishWho" role="group" aria-label="Vem är det till"></div>
    <div class="who-pick" id="wishFilter" role="group" aria-label="Visa"></div>
    <div class="total" id="wishTotal" hidden></div>
    <div id="wishList"></div>
  </section>

  <!-- VECKOMENY -->
  <section id="v-plan" hidden>
    <div class="weeknav">
      <button class="iconbtn" id="prevW" aria-label="Föregående 7 dagar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="lbl" id="weekLbl"></div>
      <button class="iconbtn" id="nextW" aria-label="Nästa 7 dagar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="row" style="margin-bottom:10px">
      <button class="btn ghost small" id="fillRandom">Slumpa tomma middagar</button>
      <button class="btn ghost small" id="allRester">Rester till alla luncher</button>
    </div>
    <div class="list" id="days"></div>
    <div class="total" id="weekCost" hidden></div>
    <div class="pairs" id="pairs" hidden></div>
    <div class="panel">
      <div class="head">
        <div><h2>Att handla till menyn</h2><div class="sub" id="ingSub"></div></div>
        <button class="btn" id="ingAdd">Lägg på listan</button>
      </div>
      <div id="ingList"></div>
    </div>
  </section>

  <!-- RÄTTER -->
  <section id="v-dish" hidden>
    <div class="addrow">
      <input class="field" id="dishSearch" placeholder="Sök rätt eller ingrediens" aria-label="Sök rätt">
      <button class="btn" id="newDish">Ny rätt</button>
    </div>
    <div id="dishList" style="margin-top:14px"></div>
    <div class="who"><span id="whoAmI"></span><button class="btn ghost small" id="logoutBtn" type="button">Logga ut</button></div>
  </section>
</div>

<nav class="tabs" role="tablist" hidden>
  <div class="in">
    <button role="tab" data-v="shop" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.5 12.5a1 1 0 0 1-1 .9h-9a1 1 0 0 1-1-.9z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span>Handla<span class="badge" id="shopBadge" hidden></span></span></button>
    <button role="tab" data-v="wish" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v8H4v-8"/><rect x="2.5" y="7" width="19" height="5" rx="1"/><path d="M12 7v13M12 7c-1.5-3-5-3.5-5-1s5 1 5 1zM12 7c1.5-3 5-3.5 5-1s-5 1-5 1z"/></svg><span>Större köp</span></button>
    <button role="tab" data-v="plan" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Veckomeny</span></button>
    <button role="tab" data-v="dish" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h16a8 8 0 0 1-16 0z"/><path d="M12 9V5M8.5 9.5 7 6M15.5 9.5 17 6"/></svg><span>Rätter</span></button>
  </div>
</nav>

<div id="sheetHost"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signInWithRedirect, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { FIREBASE_CONFIG } from "./config.js";
import { SEED_DISHES, MORE_DISHES } from "./seed.js";
import { estimateDish, estimateKcal, healthStars, ingredientCost } from "./prices.js";
import { canonical, sumAmounts, isTrivial, isPantry } from "./ingredients.js";
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").trim().toLowerCase();
const cap = s => { s = String(s || "").trim(); return s ? s[0].toUpperCase() + s.slice(1) : s; };
const kr = n => Math.round(n).toLocaleString("sv-SE") + " kr";
const toPrice = v => { const n = Math.round(Number(String(v ?? "").replace(/\s/g, "").replace(",", "."))); return Number.isFinite(n) && n > 0 ? n : null; };
const SEED_COST = Object.fromEntries(SEED_DISHES.map(d => [d.id, d.cost]));
// Pris för en rätt: det ni själva angett, annars starträttens pris, annars en uppskattning från ingredienserna.
const dishKcal = d => d ? estimateKcal(d.ingredients).perPortion : 0;
const dishHealth = d => d ? healthStars(estimateKcal(d.ingredients).density) : 0;
const dishTaste = d => (d && Number.isInteger(d.taste) && d.taste >= 1 && d.taste <= 5) ? d.taste : 0;
// Fem stjärnor där n är ifyllda; kind styr färgen (nyttig eller gott).
const stars = (n, kind) => `<span class="stars ${kind}" aria-label="${n} av 5">${"★".repeat(n)}<span class="off">${"★".repeat(5 - n)}</span></span>`;
const dishCost = d => {
  if (!d) return null;
  if (typeof d.cost === "number") return d.cost;
  if (d.cost === undefined && SEED_COST[d.id]) return SEED_COST[d.id];
  return estimateDish(d.ingredients).total || null;
};

function guessCat(name){
  const n = norm(name); if(!n) return "ovrigt";
  const words = n.split(/[^a-zåäöéü]+/).filter(Boolean);
  for (const [cat, kws] of GUESS){
    for (const kw of kws){
      if (kw.length <= 3){ if (words.some(w => w === kw || w.startsWith(kw))) return cat; }
      else if (n.includes(kw)) return cat;
    }
  }
  return "ovrigt";
}

function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function showErr(e){
  console.error(e);
  if (e && e.code === "quota_exceeded") toast("Databasen är full. Rensa köpta varor och försök igen.");
  else if (e && e.code === "permission-denied") toast("Ditt konto har inte behörighet att ändra listan.");

}

function openItem(name){ return S.items.find(i => !i.done && norm(i.name) === norm(name)); }

async function addItem(name, note = "", cat = "", source = "manuell"){
  name = cap(name); if (!name || !db) return false;
  const existing = openItem(name);
  if (existing){
    if (note && !norm(existing.note).includes(norm(note))){
      await db.doc("items/" + existing.id).update({ note: existing.note ? existing.note + " + " + note : note }).catch(showErr);
    } else if (source === "manuell") toast(`${name} står redan på listan`);
    return false;
  }
  await db.collection("items").add({ name, note: note || "", cat: cat || guessCat(name), done: false,
    createdAt: Date.now(), doneAt: null, addedBy: me || null, addedByName: myName, source }).catch(showErr);
  return true;
}

async function toggleItem(id){
  const it = S.items.find(i => i.id === id); if (!it) return;
  await db.doc("items/" + id).update({ done: !it.done, doneAt: !it.done ? Date.now() : null }).catch(showErr);
}
async function removeItem(id){ await db.doc("items/" + id).delete().catch(showErr); }
async function clearDone(){
  const done = S.items.filter(i => i.done);
  for (const i of done){ try { await db.doc("items/" + i.id).delete(); } catch(e){ showErr(e); break; } }
  toast(`Rensade ${done.length} köpta varor`);
}

/* ---------- Veckomeny ---------- */
const dishById = id => S.dishes.find(d => d.id === id);
function mealLabel(m){
  if (!m) return "";
  if (m.type === "rester") return "Rester";
  if (m.dishId){ const d = dishById(m.dishId); return d ? d.name : (m.text || "Borttagen rätt"); }
  return m.text || "";
}
function weekDates(){ const s = addDays(today0(), S.offset*7); return Array.from({length:7}, (_,i) => addDays(s,i)); }

async function saveMeal(key, meal, which){
  const cur = S.days[key] || {};
  const next = { date: key, dinner: cur.dinner || null, lunch: cur.lunch || null };
  next[which] = meal;
  S.days[key] = next; render();
  await db.doc("days/" + key).set(next).catch(showErr);
}

function renderPlan(){
  const ds = weekDates(), tk = keyOf(today0());
  const a = ds[0], b = ds[6];
  $("#weekLbl").textContent = `${a.getDate()} ${MONTHS[a.getMonth()]} – ${b.getDate()} ${MONTHS[b.getMonth()]}`;
  $("#days").innerHTML = ds.map(d => {
    const k = keyOf(d), day = S.days[k] || {};
    const dn = mealLabel(day.dinner), ln = mealLabel(day.lunch), isR = day.lunch && day.lunch.type === "rester";
    return `<div class="day${k === tk ? " today" : ""}" data-k="${k}">
      <div class="dlabel"><b>${k === tk ? "Idag" : DAYS[d.getDay()]}</b><span>${d.getDate()} ${MONTHS[d.getMonth()]}</span></div>
      <div class="meals">
        <div class="meal"><span class="k">Lunch</span>
          <button class="slot${ln ? " set" : ""}${isR ? " rester" : ""}" data-w="lunch">${ln ? esc(ln) : "Välj lunch"}</button>
          <button class="rq" data-r="1" aria-pressed="${isR}">Rester</button></div>
        <div class="meal"><span class="k">Middag</span>
          <button class="slot${dn ? " set" : ""}" data-w="dinner">${dn ? esc(dn) : "Välj middag"}</button></div>
      </div></div>`;
  }).join("");
  renderWeekCost(ds);
  renderPairs();
  renderIngredients();
}

$("#days").addEventListener("click", e => {
  const day = e.target.closest("[data-k]"); if (!day) return;
  const k = day.dataset.k;
  if (e.target.closest("[data-r]")){
    const cur = S.days[k] && S.days[k].lunch;
    saveMeal(k, cur && cur.type === "rester" ? null : { type: "rester" }, "lunch");

});
$("#fillRandom").addEventListener("click", async () => {
  if (!S.dishes.length) return toast("Lägg till rätter först");
  const ds = weekDates().map(keyOf);
  const used = new Set(ds.map(k => S.days[k]?.dinner?.dishId).filter(Boolean));
  let pool = S.dishes.filter(d => !used.has(d.id)).sort(() => Math.random() - .5);
  let n = 0;
  for (const k of ds){
    if (S.days[k]?.dinner) continue;
    if (!pool.length) pool = S.dishes.slice().sort(() => Math.random() - .5);
    const d = pool.shift(); await saveMeal(k, { type: "dish", dishId: d.id }, "dinner"); n++;
  }
  toast(n ? `Fyllde ${n} middagar. Tryck på en för att byta.` : "Alla middagar är redan valda");
});

function renderWeekCost(ds){
  let sum = 0, n = 0, missing = 0;
  for (const d of ds){
    const day = S.days[keyOf(d)] || {};
    for (const m of [day.dinner, day.lunch]){
      if (!m || !m.dishId) continue;
      const c = dishCost(dishById(m.dishId)); n++;
      if (c) sum += c; else missing++;
    }
  }
  const el = $("#weekCost"); el.hidden = !n;
  el.innerHTML = `<span>Uppskattad matkostnad för ${n} ${n === 1 ? "måltid" : "måltider"}${missing ? ` · ${missing} utan pris` : ""}</span><b>≈ ${kr(sum)}</b>`;
}

/* Rätter som delar varor med veckans val, så att det blir mindre över */
// Bara varor man inte alltid har hemma räknas (nötfärs och fiskpinnar, inte pasta och ägg).
const dishKeys = d => new Set((d.ingredients || []).map(i => canonical(i.n)).filter(c => c.key && !isPantry(c.key)).map(c => c.key));
function weekPairs(){
  const chosen = new Set(), keys = new Map();
  for (const d of weekDates()){
    const day = S.days[keyOf(d)] || {};
    for (const m of [day.dinner, day.lunch]) if (m && m.dishId) chosen.add(m.dishId);
  }
  for (const id of chosen){ const d = dishById(id); if (d) for (const k of dishKeys(d)) keys.set(k, canonical(k).name); }
  if (!keys.size) return new Map();
  const out = new Map();
  for (const d of S.dishes){
    if (chosen.has(d.id)) continue;
    const shared = [...dishKeys(d)].filter(k => keys.has(k));
    if (!shared.length) continue;
    // Dyrare varor väger tyngre: att dela nötfärs är värt mer än att dela en gurka.
    const score = shared.reduce((a, k) => a + ingredientCost({ n: keys.get(k) }).cost, 0);
    out.set(d.id, { shared: shared.map(k => keys.get(k)), score });
  }
  return out;
}
const topPairs = (pairs, n) => [...pairs].filter(([, p]) => p.score >= 15).sort((a, b) => b[1].score - a[1].score || dishTaste(dishById(b[0])) - dishTaste(dishById(a[0]))).slice(0, n);
function renderPairs(){
  const el = $("#pairs"), top = topPairs(weekPairs(), 3);
  const free = weekDates().map(keyOf).find(k => !(S.days[k] && S.days[k].dinner));
  el.hidden = !top.length || !free;
  if (el.hidden) return;
  el.innerHTML = `<h3>Passar ihop med veckans rätter</h3><div class="opts">` + top.map(([id, p]) => `<button type="button" data-pair="${esc(id)}"><span><b>${esc(dishById(id).name)}</b><small>Delar ${esc(p.shared.join(", ").toLowerCase())}</small></span><span class="add">+ Lägg till</span></button>`).join("") + `</div>`;
}
$("#pairs").addEventListener("click", e => {
  const b = e.target.closest("[data-pair]"); if (!b) return;
  const k = weekDates().map(keyOf).find(k => !(S.days[k] && S.days[k].dinner));
  if (!k) return toast("Alla middagar är redan valda");
  saveMeal(k, { type: "dish", dishId: b.dataset.pair }, "dinner");
  const d = new Date(k + "T12:00:00");
  toast(`${dishById(b.dataset.pair).name} lagd på ${DAYS[d.getDay()].toLowerCase()}`);
});

/* Ingredienser för veckan */
function weekIngredients(){
  const map = new Map();
  for (const d of weekDates()){
    const day = S.days[keyOf(d)] || {};
    for (const m of [day.dinner, day.lunch]){
      if (!m || !m.dishId) continue;
      const dish = dishById(m.dishId); if (!dish) continue;
      for (const ing of dish.ingredients || []){
        const c = canonical(ing.n); if (!c.key) continue;
        if (!map.has(c.key)) map.set(c.key, { key: c.key, name: c.name, amts: [], dishes: new Set() });
        const e = map.get(c.key); if (ing.m) e.amts.push(ing.m); e.dishes.add(dish.name);
      }
    }
  }
  // Summera samma vara: 400 g + 400 g blir 800 g.
  for (const e of map.values()) e.total = sumAmounts(e.amts);
  return [...map.values()].sort((a,b) => {
    const ca = CATS.findIndex(c => c[0] === guessCat(a.name)), cb = CATS.findIndex(c => c[0] === guessCat(b.name));
    return ca - cb || a.name.localeCompare(b.name, "sv");
  });
}
const weekId = () => keyOf(weekDates()[0]);
const haveSet = () => new Set((S.weeks[weekId()] && S.weeks[weekId()].have) || []);
function ingChecked(e){
  if (haveSet().has(e.key)) return false;
  if (S.ingOff.has(e.key)) return false;
  if (S.ingOn.has(e.key)) return true;
  return !isStaple(e.name) && !openItem(e.name);
}
function renderIngredients(){
  const list = weekIngredients();
  const dishesCount = new Set(weekDates().flatMap(d => { const x = S.days[keyOf(d)] || {}; return [x.dinner?.dishId, x.lunch?.dishId]; }).filter(Boolean)).size;
  if (!list.length){
    $("#ingSub").textContent = "";
    $("#ingList").innerHTML = `<div class="empty" style="margin-top:0"><strong>Inga rätter valda än</strong>Välj middagar ovan så samlas allt ni behöver här.</div>`;
    $("#ingAdd").disabled = true; return;
  }
  const n = list.filter(ingChecked).length, have = haveSet();
  const got = list.filter(e => have.has(e.key)).length;
  $("#ingSub").textContent = `${list.length} varor från ${dishesCount} rätter · ${n} valda${got ? ` · ${got} har ni redan` : ""}`;
  $("#ingAdd").disabled = !n; $("#ingAdd").textContent = n ? `Lägg ${n} på listan` : "Lägg på listan";
  const row = e => {
    const on = ingChecked(e), already = openItem(e.name), st = isStaple(e.name), h = have.has(e.key);
    return `<label class="ing${on ? "" : " off"}${h ? " got" : ""}"><input type="checkbox" data-ing="${esc(e.key)}" ${on ? "checked" : ""}${h ? " disabled" : ""}>
      <div class="t"><div><b>${esc(e.name)}</b>${h ? `<span class="tag">har redan</span>` : already ? `<span class="tag">på listan</span>` : st ? `<span class="tag">basvara</span>` : ""}</div>
      ${e.total ? `<div class="amt">${esc(e.total)}</div>` : ""}
      <div class="why">${esc([...e.dishes].join(", "))}</div></div>
      <button type="button" class="have" data-have="${esc(e.key)}" aria-pressed="${h}">${h ? "Ångra" : "Har redan"}</button></label>`;
  };
  // Det ni redan har samlas längst ner i en ihopfälld rad.
  const need = list.filter(e => !have.has(e.key)), gotList = list.filter(e => have.has(e.key));
  $("#ingList").innerHTML = (need.length ? `<div class="list">${need.map(row).join("")}</div>` : `<div class="empty" style="margin-top:0">Ni har allt som behövs för veckans rätter.</div>`) +
    (gotList.length ? `<details class="havebox"${S.haveOpen ? " open" : ""}><summary>Har redan hemma (${gotList.length})</summary><div class="list">${gotList.map(row).join("")}</div></details>` : "");
  const det = $("#ingList .havebox"); if (det) det.addEventListener("toggle", () => { S.haveOpen = det.open; });
}
$("#ingList").addEventListener("click", async e => {
  const b = e.target.closest("[data-have]"); if (!b) return;
  e.preventDefault(); // klicket ska inte bocka i rutan i samma rad
  const have = haveSet(), k = b.dataset.have, wk = weekId();
  if (have.has(k)) have.delete(k); else have.add(k);
  S.weeks[wk] = { have: [...have] }; renderIngredients();
  await db.doc("weeks/" + wk).set({ have: [...have], updatedAt: Date.now() }).catch(showErr);
});
$("#ingList").addEventListener("change", e => {
  const k = e.target.dataset.ing; if (!k) return;
  if (e.target.checked){ S.ingOff.delete(k); S.ingOn.add(k); } else { S.ingOn.delete(k); S.ingOff.add(k); }
  renderIngredients();
});
$("#ingAdd").addEventListener("click", async () => {
  const list = weekIngredients().filter(ingChecked);
  $("#ingAdd").disabled = true;
  let added = 0;
  for (const e of list){ if (await addItem(e.name, e.total, "", "meny")) added++; }
  S.ingOn.clear(); S.ingOff.clear();
  toast(`${added} nya varor på handlingslistan`);
  render();
});

/* ---------- Rätter ---------- */
const ingToText = ings => (ings || []).map(i => i.m ? `${i.n}, ${i.m}` : i.n).join("\n");
const textToIng = t => t.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
  const ix = l.indexOf(","); return ix < 0 ? { n: cap(l), m: "" } : { n: cap(l.slice(0, ix).trim()), m: l.slice(ix + 1).trim() };
}).filter(i => i.n);

function renderDishes(){
  const q = norm(S.search);
  const ds = S.dishes.filter(x => !q || norm(x.name).includes(q) || (x.ingredients||[]).some(i => norm(i.n).includes(q)));
  if (!S.dishes.length){
    $("#dishList").innerHTML = `<div class="empty"><strong>Inga rätter än</strong>Tryck på "Ny rätt" och skriv in en rätt ni brukar laga, med ingredienserna rad för rad.<div style="margin-top:12px"><button class="btn" data-seed="1" type="button">Lägg in ${SEED_DISHES.length} starträtter</button></div></div>`; return;
  }
  const by = { taste: x => -dishTaste(x), health: x => estimateKcal(x.ingredients).density || 1e9, cost: x => dishCost(x) || 1e9 }[S.dishSort];
  if (by) ds.sort((a, b) => by(a) - by(b) || a.name.localeCompare(b.name, "sv"));
  const missing = MORE_DISHES.filter(m => !S.dishes.some(x => x.id === m.id));
  const moreDone = S.meta && S.meta.seeds && S.meta.seeds.more;
  const moreBtn = missing.length && !moreDone ? `<div class="pairs" style="margin:0 0 12px"><h3>Fler rätter</h3><div class="spread"><span class="hint">${missing.length} vardagsrätter med vanliga ingredienser, till exempel ${esc(missing.slice(0, 3).map(m => m.name.toLowerCase()).join(", "))}.</span><button class="btn small" data-more="1" type="button">Lägg till ${missing.length} rätter</button></div></div>` : "";
  $("#dishList").innerHTML = moreBtn + `<div class="spread" style="margin:0 2px 8px"><span class="count">${ds.length} av ${S.dishes.length} rätter</span>
      <select class="sortsel" id="dishSort" aria-label="Sortera">${[["name","Sortera: Namn"],["taste","Godast först"],["health","Nyttigast först"],["cost","Billigast först"]].map(([k,n]) => `<option value="${k}"${(S.dishSort || "name") === k ? " selected" : ""}>${n}</option>`).join("")}</select></div>` +
    (ds.length ? `<div class="list">` + ds.map(x => `<div class="dish" data-dish="${esc(x.id)}"><div class="t"><div class="n">${esc(x.name)}${x.builtin ? "" : `<span class="tag">egen</span>`}</div><div class="i">${esc((x.ingredients||[]).map(i => i.m ? `${i.n} ${i.m}` : i.n).join(", ")) || "Inga ingredienser"}</div>
      <div class="rate"><span>Nyttig ${stars(dishHealth(x), "health")}${dishKcal(x) ? ` ${dishKcal(x)} kcal` : ""}</span><span>Gott ${stars(dishTaste(x), "taste")}</span></div></div><span class="price${dishCost(x) ? "" : " none"}">${dishCost(x) ? "≈ " + kr(dishCost(x)) : "inget pris"}</span></div>`).join("") + `</div>`
      : `<div class="empty">Ingen rätt matchar "${esc(S.search)}".</div>`);
}
$("#dishSearch").addEventListener("input", e => { S.search = e.target.value; renderDishes(); });
try { S.dishSort = localStorage.getItem("kp-dishsort") || "name"; } catch { S.dishSort = "name"; }

  openSheet(`<h2>${d ? "Redigera rätt" : "Ny rätt"}</h2>
    <form class="stack" id="dishForm">
      <div><label class="l" for="dName">Namn</label><input class="field" style="width:100%" id="dName" value="${esc(d ? d.name : "")}" placeholder="t.ex. Kycklinggryta med ris" required></div>

        <textarea class="field" id="dIng" placeholder="Kycklingfilé, 600 g&#10;Ris, 4 port&#10;Gul lök&#10;Matlagningsgrädde, 2 dl">${esc(d ? ingToText(d.ingredients) : "")}</textarea>
        <div class="hint">Skriv mängden efter ett kommatecken om ni vill, t.ex. "Köttfärs, 500 g".</div></div>
      <div><label class="l" for="dCost">Ungefärlig kostnad för hela rätten (kr)</label><input class="field" style="width:100%" id="dCost" type="number" inputmode="numeric" min="0" step="1" value="${d && typeof d.cost === "number" ? d.cost : d && d.cost === undefined && SEED_COST[d.id] ? SEED_COST[d.id] : ""}" placeholder="Lämna tomt för att använda förslaget">
        <div class="est" id="dEst"></div></div>
      <div><span class="l">Hur gott tycker ni att det är?</span><div class="starpick" id="dTaste" role="group" aria-label="Betyg för hur gott">${[1,2,3,4,5].map(n => `<button type="button" data-t="${n}" aria-label="${n} av 5">★</button>`).join("")}</div></div>
      <div><span class="l">Nyttighet (räknas ut av appen)</span><div id="dHealth" class="hint"></div></div>
      <div class="spread">
        ${d ? `<button type="button" class="btn danger small" id="dDel">Ta bort rätten</button>` : "<span></span>"}
        <div class="row"><button type="button" class="btn ghost" id="dCancel">Avbryt</button><button class="btn" type="submit">Spara</button></div>
      </div>
    </form>`, () => {
    if (!d) $("#dName").focus();
    $("#dCancel").addEventListener("click", closeSheet);
    const drawEst = () => {
      const e = estimateDish(textToIng($("#dIng").value));
      if (!e.rows.length){ $("#dEst").innerHTML = `<div class="hint">Skriv in ingredienserna så föreslår appen ett pris.</div>`; return; }
      $("#dEst").innerHTML = `<div class="spread"><span class="hint">Förslag utifrån ingredienserna: <b>≈ ${kr(e.total)}</b>${e.unknown ? ` · ${e.unknown} gissade` : ""}</span>
        <button type="button" class="btn ghost small" id="dUseEst">Använd förslaget</button></div>
        <details><summary class="hint">Visa uträkningen</summary><div class="hint">${e.rows.map(r => `${esc(r.n)}${r.m ? " (" + esc(r.m) + ")" : ""}: ${r.known ? "" : "gissat "}${kr(r.cost)}`).join("<br>")}</div></details>`;
      $("#dUseEst").addEventListener("click", () => { $("#dCost").value = e.total; });
    };
    drawEst();
    let taste = dishTaste(d);
    const drawTaste = () => { for (const b of $("#dTaste").children) b.classList.toggle("on", Number(b.dataset.t) <= taste); };
    drawTaste();
    $("#dTaste").addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (!b) return; const n = Number(b.dataset.t); taste = taste === n ? 0 : n; drawTaste(); });
    const drawHealth = () => {
      const k = estimateKcal(textToIng($("#dIng").value));
      $("#dHealth").innerHTML = k.perPortion ? `${stars(healthStars(k.density), "health")} ≈ ${k.density} kcal per 100 g · ≈ ${k.perPortion} kcal per portion (4 portioner)${k.unknown ? ` · ${k.unknown} gissade` : ""}<br>Stjärnorna bygger på kcal per 100 g, så de beror inte på hur stort receptet är.` : "Skriv in ingredienserna så räknar appen ut det.";
    };
    drawHealth();
    $("#dIng").addEventListener("input", () => { drawEst(); drawHealth(); });

}

function makeDb(fs){
  const wrap = s => ({ docs: s.docs.map(d => ({ id: d.id, data: () => d.data() })) });
  return {
    collection: p => ({ add: d => addDoc(collection(fs, p), d), onSnapshot: (n, e) => onSnapshot(collection(fs, p), s => n(wrap(s)), e) }),
    doc: p => ({ set: d => setDoc(doc(fs, p), d), update: d => updateDoc(doc(fs, p), d), delete: () => deleteDoc(doc(fs, p)) }),
  };
}

    me = u.uid; myName = (u.displayName || u.email || "").split(" ")[0];
    $("#whoAmI").textContent = "Inloggad som " + (u.email || u.displayName || "");
    db = makeDb(fsRef);
    let first = 0;
    const ready = () => { if (++first === 3) $("#syncState").textContent = "Synkad"; };
    const onErr = e => {
      console.error(e);
      if (e.code === "permission-denied"){
        $("#offline").hidden = false;
        $("#offline").textContent = `Kontot ${u.email} har inte tillgång till listan. Logga ut och välj ett annat konto, eller be den som satte upp appen att lägga till din adress.`;
      } else showErr(e);
      $("#syncState").textContent = "Frånkopplad";
    };
    unsubs.push(db.collection("items").onSnapshot(s => { S.items = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); ready(); }, onErr));
    unsubs.push(db.collection("dishes").onSnapshot(s => { S.dishes = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => a.name.localeCompare(b.name, "sv")); render(); ready(); }, onErr));
    unsubs.push(db.collection("meta").onSnapshot(s => { const o = {}; for (const d of s.docs) o[d.id] = d.data(); S.meta = o; render(); }, onErr));
    unsubs.push(db.collection("weeks").onSnapshot(s => { const o = {}; for (const d of s.docs) o[d.id] = d.data(); S.weeks = o; render(); }, onErr));
    unsubs.push(db.collection("wishes").onSnapshot(s => { S.wishes = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, onErr));
    unsubs.push(db.collection("days").onSnapshot(s => { const o = {}; for (const d of s.docs) o[d.id] = d.data(); S.days = o; render(); ready(); }, onErr));
  });
}
})();
</script>
<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
