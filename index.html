<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d6a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Köksplanen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Köksplanen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobilförst, en kolumn med flikar i botten; varje flik är en arbetsyta, inte en sida att läsa. */
:root{
  --bg:#f2f4ef; --surface:#ffffff; --sunk:#e8ece5; --ink:#1c2822; --muted:#5d6c64; --line:#d9e0d8;
  --accent:#2d6a4d; --accent-ink:#ffffff; --accent-soft:#dcebe2; --mark:#e6b52e; --mark-soft:#f8ecc6; --mark-ink:#4a3a08;
  --done:#98a49d; --danger:#b23a2e;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#19211d; --sunk:#151c18; --ink:#e4ebe6; --muted:#9aa9a1; --line:#2a3530;
  --accent:#6dbd92; --accent-ink:#0d1912; --accent-soft:#1f3329; --mark:#e0b43f; --mark-soft:#3a3016; --mark-ink:#f6e3a6;
  --done:#5c6a62; --danger:#e57366; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211d; --sunk:#151c18; --ink:#e4ebe6; --muted:#9aa9a1; --line:#2a3530;
  --accent:#6dbd92; --accent-ink:#0d1912; --accent-soft:#1f3329; --mark:#e0b43f; --mark-soft:#3a3016; --mark-ink:#f6e3a6;
  --done:#5c6a62; --danger:#e57366; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:420px;margin:0 auto;text-align:left}
.login h1{font-size:2.6rem}
.login p{color:var(--muted);margin:0}
.who{margin-top:28px;color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}

header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font:800 1.9rem/1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font:700 1.25rem/1.15 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem}
.banner{background:var(--mark-soft);color:var(--mark-ink);border-radius:var(--r);padding:10px 12px;font-size:.92rem;margin-bottom:12px}

/* Bottenflikar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-weight:600;font-size:.8rem}
nav.tabs button svg{width:24px;height:24px}
.who-pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.who-pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;min-height:40px;font-weight:600;font-size:.92rem;color:var(--ink)}
.who-pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#wishFilter button{padding:7px 12px;min-height:36px;font-size:.85rem;font-weight:500}
#wishFilter{gap:4px}
.who-pick .lbl{align-self:center;font-size:.8rem;color:var(--muted);margin-right:2px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs button{position:relative}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.7rem;line-height:18px;text-align:center}

/* Formulär */
.addrow{display:flex;gap:8px}
.field{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:16px}
.sheet .field{width:100%}
.field:focus{outline:2px solid var(--accent);outline-offset:-1px}
select.field{flex:0 0 auto;max-width:42%}
.btn{border:0;border-radius:var(--r);padding:12px 16px;min-height:44px;font-weight:700;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.small{padding:8px 13px;font-size:.88rem;min-height:38px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:.92rem;color:var(--ink);min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.wrapchips{flex-wrap:wrap;overflow:visible;padding-top:0}
.addbig{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;font-size:1.02rem;border-radius:14px}
.addbig svg{width:20px;height:20px}
.chiphead{font:600 .72rem/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:16px 2px 0}
.chip:active{background:var(--accent-soft)}

/* Handlingslista */
.group{margin-top:18px}
.group h3{font:600 .75rem/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 6px 2px;display:flex;justify-content:space-between}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.tick{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);background:transparent;display:grid;place-items:center;padding:0}
.tick svg{width:15px;height:15px;opacity:0}
.item.done .tick{background:var(--done);border-color:var(--done)}
.item.done .tick svg{opacity:1;color:var(--surface)}
.item .txt{flex:1;min-width:0;cursor:pointer}
.item .name{font-weight:600;overflow-wrap:anywhere}
.item .meta{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.item.done .name{text-decoration:line-through;color:var(--done);font-weight:500}
.x{flex:0 0 auto;border:0;background:none;color:var(--muted);width:44px;height:44px;margin:-6px -6px -6px 0;border-radius:10px;font-size:1.35rem;line-height:1}
.x:hover{background:var(--sunk)}
.empty{text-align:center;color:var(--muted);padding:34px 16px;border:1px dashed var(--line);border-radius:var(--r);margin-top:18px}
.empty strong{display:block;color:var(--ink);font:700 1.1rem var(--display);margin-bottom:4px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:6px;background:var(--mark-soft);color:var(--mark-ink);vertical-align:1px;margin-left:6px}

/* Veckomeny */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.weeknav .lbl{font-weight:700;text-align:center;flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:44px;height:44px;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.day{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day.today{background:var(--accent-soft)}
.dlabel{display:flex;flex-direction:column;line-height:1.1}
.dlabel b{font:700 1.05rem var(--display)}
.dlabel span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meals{display:flex;flex-direction:column;gap:6px;min-width:0}
.meal{display:flex;align-items:center;gap:8px;min-width:0}
.meal .k{flex:0 0 52px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.slot{width:100%;min-width:0;min-height:46px;text-align:left;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:10px 12px;color:var(--muted);overflow-wrap:anywhere}
.slot.set{border-style:solid;border-color:transparent;background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.slot.rester{background:var(--mark-soft);color:var(--mark-ink);box-shadow:none}
.slot.out{background:var(--sunk);color:var(--muted);box-shadow:none;font-style:italic}
.rq{flex:0 0 auto;border:1px solid var(--mark);background:transparent;color:var(--ink);border-radius:999px;padding:6px 10px;font-size:.8rem;font-weight:600}
.rq[aria-pressed="true"]{background:var(--mark);color:#2b2205}

.buybtn{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:14px;padding:12px 14px;min-height:56px;margin-bottom:12px;background:var(--accent);color:var(--accent-ink)}
.buybtn.calm{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.buybtn svg{width:24px;height:24px;flex:0 0 auto}
.buybtn .t{flex:1;min-width:0}
.buybtn b{display:block;font:700 1.02rem var(--display)}
.buybtn small{display:block;font-size:.8rem;opacity:.85}
.bubble{flex:0 0 auto;min-width:28px;height:28px;padding:0 8px;border-radius:14px;background:var(--danger);color:#fff;font-weight:700;font-size:.9rem;display:grid;place-items:center;font-variant-numeric:tabular-nums}
nav.tabs .badge.alert{background:var(--danger);color:#fff}
.ing{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-top:1px solid var(--line)}
.ing:first-child{border-top:0}
.ing .t{flex:1;min-width:0}
.ing .t b{overflow-wrap:anywhere}
.ing .amt{font-size:.85rem;color:var(--ink)}
.ing .why{font-size:.75rem;color:var(--muted)}
.ing .btn{min-height:44px}
.sheetbar{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--bg);display:flex;gap:8px;padding:12px 0 calc(4px + env(safe-area-inset-bottom,0px));margin-top:12px;border-top:1px solid var(--line)}
.sheetbar .btn{flex:1;min-height:48px}

/* Rätter */
.dish{display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--line);cursor:pointer}
.dish:first-child{border-top:0}
.dish .t{flex:1;min-width:0}
.dish .n{font-weight:600}
.dish .i{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.price{flex:0 0 auto;border:0;background:var(--sunk);color:var(--ink);border-radius:8px;padding:5px 9px;font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.price.none{background:transparent;color:var(--muted);font-weight:500;border:1px dashed var(--line)}
.item.done .price{color:var(--done)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;margin-top:14px}
.total b{font:700 1.25rem var(--display);font-variant-numeric:tabular-nums}
.total span{font-size:.85rem;color:var(--muted)}
.addrow .pricein{flex:0 0 92px;min-width:0}
.stars{letter-spacing:1px;font-size:.85rem;white-space:nowrap}
.stars.health{color:var(--accent)}
.stars.taste{color:var(--mark)}
.stars .off{color:var(--line)}
.rate{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted);margin-top:3px;align-items:center}
.rate > span{display:inline-flex;gap:4px;align-items:center}
.starpick{display:flex;gap:2px}
.starpick button{border:0;background:none;font-size:1.9rem;line-height:1;padding:2px 4px;color:var(--line)}
.starpick button.on{color:var(--mark)}
.sortsel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:.85rem}
.ing .have{flex:0 0 auto;align-self:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:.78rem;font-weight:600;color:var(--ink)}
.ing .have[aria-pressed="true"]{background:var(--sunk);color:var(--muted);border-color:transparent}
.ing.got .t b{text-decoration:line-through;color:var(--muted)}
.pairs{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface)}
.pairs h3{font:600 .75rem/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px}
.pairs .opts{display:flex;flex-direction:column;gap:6px}
.pairs button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:0;background:var(--accent-soft);border-radius:10px;padding:9px 12px;color:var(--ink)}
.pairs button small{color:var(--muted);font-size:.78rem;display:block}
.pairs button .add{flex:0 0 auto;font-weight:700;color:var(--accent);font-size:.85rem}
.dish.pair{background:var(--accent-soft)}
.shared{font-size:.78rem;color:var(--accent);font-weight:600;margin-top:2px}
.pkhead{font:600 .72rem/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:10px 12px 6px;border-top:1px solid var(--line)}
.pkhead:first-child{border-top:0}
.havebox{margin-top:10px}
.havebox summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:.9rem;padding:8px 2px}
.havebox .list{margin-top:4px}
.speed{display:flex;align-items:center;gap:12px;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;background:var(--mark-soft);color:var(--mark-ink)}
.speed .bolt{font-size:1.4rem;line-height:1}
.speed .t{flex:1;min-width:0}
.speed .t b{display:block;font:700 1.02rem var(--display);color:var(--ink)}
.speed .t small{font-size:.8rem}
.speed.missing{border:2px dashed var(--mark);background:transparent}
.slot .zap{color:var(--mark);margin-right:4px}
.pkspeed{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--mark);background:var(--mark-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px}
.pkspeed b{font:700 1rem var(--display)}
.pkspeed small{display:block;font-size:.8rem;color:var(--muted)}
.est{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.est details summary{cursor:pointer}
.est details .hint{margin-top:4px;line-height:1.6}

/* Ark (bottom sheet) */
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;max-height:88dvh;overflow:auto;border-radius:18px 18px 0 0;
  padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:10px}
label.l{font-size:.8rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
textarea.field{min-height:180px;resize:vertical;width:100%;line-height:1.5}
.hint{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:60;max-width:90%;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>


<div class="wrap login" id="login" hidden>
  <h1>Köksplanen</h1>
  <p id="loginMsg">Familjens handlingslista och veckomeny. Logga in med ditt Google-konto för att se er gemensamma lista.</p>
  <div><button class="btn" id="loginBtn">Logga in med Google</button></div>
</div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <h1 id="viewTitle">Handla</h1>
    <span class="sub" id="syncState">Ansluter…</span>
  </header>
  <div class="banner" id="offline" hidden></div>

  <!-- HANDLA -->
  <section id="v-shop">
    <button class="btn addbig" id="addOpen" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Lägg till vara</button>
    <div class="chiphead">Era vanligaste</div>
    <div class="chips wrapchips" id="quick" style="padding-top:8px"></div>
    <div id="shopList"></div>
  </section>

  <!-- STÖRRE KÖP -->
  <section id="v-wish" hidden>
    <button class="btn addbig" id="wishOpen" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Lägg till sak</button>
    <div class="who-pick" id="wishFilter" role="group" aria-label="Visa"></div>
    <div class="total" id="wishTotal" hidden></div>
    <div id="wishList"></div>
  </section>

  <!-- VECKOMENY -->
  <section id="v-plan" hidden>
    <div class="weeknav">
      <button class="iconbtn" id="prevW" aria-label="Föregående 7 dagar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="lbl" id="weekLbl"></div>
      <button class="iconbtn" id="nextW" aria-label="Nästa 7 dagar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <button class="buybtn" id="buyOpen" type="button"></button>
    <div id="speed"></div>
    <div class="list" id="days"></div>
    <div class="total" id="weekCost" hidden></div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="fillRandom" style="width:100%">Slumpa tomma middagar</button></div>
    <div class="pairs" id="pairs" hidden></div>
  </section>

  <!-- RÄTTER -->
  <section id="v-dish" hidden>
    <div class="addrow">
      <input class="field" id="dishSearch" placeholder="Sök rätt eller ingrediens" aria-label="Sök rätt">
      <button class="btn" id="newDish">Ny rätt</button>
    </div>
    <div id="dishList" style="margin-top:14px"></div>
    <div class="who"><span id="whoAmI"></span><button class="btn ghost small" id="logoutBtn" type="button">Logga ut</button></div>
  </section>
</div>

<nav class="tabs" role="tablist" hidden>
  <div class="in">
    <button role="tab" data-v="shop" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.5 12.5a1 1 0 0 1-1 .9h-9a1 1 0 0 1-1-.9z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span>Handla<span class="badge" id="shopBadge" hidden></span></span></button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signInWithRedirect, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { FIREBASE_CONFIG } from "./config.js";
import { SEED_DISHES, MORE_DISHES } from "./seed.js";
import { estimateDish, estimateKcal, healthStars, ingredientCost } from "./prices.js";
import { canonical, sumAmounts, isTrivial, isPantry } from "./ingredients.js";
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").trim().toLowerCase();
const cap = s => { s = String(s || "").trim(); return s ? s[0].toUpperCase() + s.slice(1) : s; };
const kr = n => Math.round(n).toLocaleString("sv-SE") + " kr";
const toPrice = v => { const n = Math.round(Number(String(v ?? "").replace(/\s/g, "").replace(",", "."))); return Number.isFinite(n) && n > 0 ? n : null; };
const SEED_COST = Object.fromEntries(SEED_DISHES.map(d => [d.id, d.cost]));
// Pris för en rätt: det ni själva angett, annars starträttens pris, annars en uppskattning från ingredienserna.
const dishKcal = d => d ? estimateKcal(d.ingredients).perPortion : 0;
const dishHealth = d => d ? healthStars(estimateKcal(d.ingredients).density) : 0;
const dishTaste = d => (d && Number.isInteger(d.taste) && d.taste >= 1 && d.taste <= 5) ? d.taste : 0;
// Fem stjärnor där n är ifyllda; kind styr färgen (nyttig eller gott).
const stars = (n, kind) => `<span class="stars ${kind}" aria-label="${n} av 5">${"★".repeat(n)}<span class="off">${"★".repeat(5 - n)}</span></span>`;
const dishCost = d => {
  if (!d) return null;
  if (typeof d.cost === "number") return d.cost;
  if (d.cost === undefined && SEED_COST[d.id]) return SEED_COST[d.id];
  return estimateDish(d.ingredients).total || null;
};

/* ---------- Kategorier ---------- */
const CATS = [
  ["frukt","Frukt & grönt"],["brod","Bröd"],["mejeri","Mejeri & ägg"],["kott","Kött, fisk & chark"],
  ["skafferi","Skafferi"],["frys","Fryst"],["dryck","Dryck"],["hund","Hunden"],["hushall","Hushåll & hygien"],["ovrigt","Övrigt"]
];
const CATNAME = Object.fromEntries(CATS);
// Ordningen spelar roll: första träff vinner.
const GUESS = [
  ["hund",["hund","bajspås","tuggben","kattsand"]],
  ["hushall",["fryspås","påsar","soppås","toalettpapper","toapapper","hushållspapper","diskmedel","disktablett","tvättmedel","sköljmedel","tvål","schampo","balsam","tandkräm","tandborst","folie","bakplåtspapper","batteri","servett","disksvamp","rengöring","glödlampa","blöj","våtservett","deodorant"]],
  ["dryck",["läsk","cola","öl","vin","juice","saft","vatten","cider","pepsi","fanta","sprite","energidryck","alkoholfri"]],
  ["frys",["fryst","glass","pommes","frysta"]],
  ["brod",["bröd","bulle","bullar","tortilla","pita","knäcke","limpa","baguette","wraps","tunnbröd","hamburgerbröd","korvbröd","frukostbröd"]],
  ["kott",["kött","färs","kyckling","fläsk","bacon","korv","skinka","lax","torsk","fisk","räk","biff","entrecote","oxfil","kassler","chorizo","kalkon","lamm","salami","pålägg","sej","kotlett","högrev","rostbiff","fläskfil","kebab"]],
  ["skafferi",["pasta","spaghetti","makaron","ris","mjöl","socker","olja","vinäger","krossade","passerade","tomatpuré","buljong","fond","krydd","salt","peppar","nudlar","taco","kokosmjölk","bönor","linser","kikärt","müsli","flingor","havre","gryn","ketchup","senap","majonnäs","soja","honung","sylt","kaffe","te","couscous","bulgur","sås","curry","paprikapulver","oregano","kanel","bakpulver","jäst","nötter","russin","chips","godis","choklad","tonfisk","oliv","pesto","sambal","sriracha","lasagneplattor","gnocchi","majs"]],
  ["frukt",["äpple","banan","päron","citron","lime","apelsin","clementin","tomat","gurka","sallad","lök","vitlök","potatis","morot","morötter","paprika","broccoli","blomkål","avokado","spenat","champinjon","svamp","zucchini","purjo","ingefära","persilja","dill","basilika","koriander","kål","frukt","bär","druv","mango","ruccola","selleri","sötpotatis","chili","rödbet","melon","kiwi","sparris","ärt","rädis","örter","majskolv","aubergine","grönsak"]],
  ["mejeri",["mjölk","fil","yoghurt","ost","smör","grädde","crème","creme","ägg","kvarg","keso","halloumi","feta","mozzarella","parmesan","mascarpone","bregott","kesella","färskost","matlagningsgrädde","havredryck"]],
];
function guessCat(name){
  const n = norm(name); if(!n) return "ovrigt";
  const words = n.split(/[^a-zåäöéü]+/).filter(Boolean);
  for (const [cat, kws] of GUESS){
    for (const kw of kws){
      if (kw.length <= 3){ if (words.some(w => w === kw || w.startsWith(kw))) return cat; }
      else if (n.includes(kw)) return cat;
    }
  }
  return "ovrigt";
}
const STAPLES = ["salt","peppar","svartpeppar","olja","olivolja","rapsolja","vatten","socker","vetemjöl","smör","matolja"];
const isStaple = n => STAPLES.includes(norm(n));

const QUICK = ["Mjölk","Bröd","Bananer","Ägg","Kaffe","Bajspåsar","Hundmat","Fryspåsar","Toapapper","Läsk","Öl","Smör","Ost"];

/* ---------- Datum ---------- */
const DAYS = ["Sön","Mån","Tis","Ons","Tor","Fre","Lör"];
const MONTHS = ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const pad = n => String(n).padStart(2,"0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };

/* ---------- Tillstånd ---------- */
const S = { items: [], dishes: [], days: {}, weeks: {}, wishes: [], wishWho: "hemmet", wishFilter: "", view: "shop", offset: 0, search: "", names: {}, meta: {} };
let db = null, me = null, myName = "", fsRef = null;

function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function showErr(e){
  console.error(e);
  if (e && e.code === "quota_exceeded") toast("Databasen är full. Rensa köpta varor och försök igen.");
  else if (e && e.code === "permission-denied") toast("Ditt konto har inte behörighet att ändra listan.");
  else toast("Det gick inte att spara. Kontrollera anslutningen och försök igen.");
}

/* ---------- Flikar ---------- */
const TITLES = { shop:"Handla", wish:"Större köp", plan:"Veckomeny", dish:"Rätter" };
function setView(v){
  S.view = v;
  for (const b of document.querySelectorAll("nav.tabs button")) b.setAttribute("aria-selected", String(b.dataset.v === v));
  $("#v-shop").hidden = v !== "shop"; $("#v-wish").hidden = v !== "wish"; $("#v-plan").hidden = v !== "plan"; $("#v-dish").hidden = v !== "dish";

}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => setView(b.dataset.v)));

/* ---------- Handla ---------- */
// Snabbval: det ni oftast lägger till, fyllt på med vanliga varor tills det finns tolv.
function quickList(){
  const counts = (S.meta.freq && S.meta.freq.counts) || {};
  const top = Object.entries(counts).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).map(([k]) => cap(k));
  const out = [];
  for (const n of [...top, ...QUICK]){
    if (out.length >= 12) break;
    if (!out.some(x => norm(x) === norm(n)) && !openItem(n)) out.push(n);
  }
  return out;
}
function renderQuick(){
  $("#quick").innerHTML = quickList().map(q => `<button type="button" class="chip" data-q="${esc(q)}">+ ${esc(q)}</button>`).join("");
}
$("#quick").addEventListener("click", async e => { const b = e.target.closest("[data-q]"); if (b && await addItem(b.dataset.q)) toast(`${b.dataset.q} på listan`); });
function countUse(name){
  if (!db || !name) return;
  db.doc("meta/freq").set({ counts: { [norm(name)]: increment(1) } }, { merge: true }).catch(console.error);
}

// Lägg till vara: ett ark med stora fält. Arket stannar öppet så att man kan lägga till flera i rad.
function openAdd(){
  openSheet(`<h2>Lägg till vara</h2>
    <form class="stack" id="aForm" autocomplete="off">
      <div><label class="l" for="aName">Vara</label><input class="field" id="aName" placeholder="t.ex. Mjölk" enterkeyhint="next" autocapitalize="sentences"></div>
      <div class="chips wrapchips" id="aSugg"></div>
      <div><label class="l" for="aNote">Mängd eller anteckning (valfritt)</label><input class="field" id="aNote" placeholder="t.ex. 2 st, laktosfri" enterkeyhint="done"></div>
      <div><span class="l">Kategori</span><div class="chips wrapchips" id="aCat" role="group" aria-label="Kategori">${CATS.map(([k, n]) => `<button type="button" class="chip" data-c="${k}" aria-pressed="false">${n}</button>`).join("")}</div></div>
      <div class="sheetbar"><button type="button" class="btn ghost" id="aDone">Klar</button><button class="btn" type="submit">Lägg till</button></div>
    </form>`, () => {
    let picked = "";
    const name = $("#aName"), note = $("#aNote");
    const drawCat = () => { const c = picked || guessCat(name.value); for (const b of $("#aCat").children) b.setAttribute("aria-pressed", String(!!name.value.trim() && b.dataset.c === c)); };
    const drawSugg = () => {
      const q = norm(name.value);
      const counts = (S.meta.freq && S.meta.freq.counts) || {};
      const pool = [...new Set([...Object.keys(counts).sort((a, b) => counts[b] - counts[a]), ...QUICK.map(norm)])];
      const hits = q ? pool.filter(n => n.startsWith(q) && n !== q).slice(0, 6) : [];
      $("#aSugg").innerHTML = hits.map(n => `<button type="button" class="chip" data-s="${esc(cap(n))}">${esc(cap(n))}</button>`).join("");
      $("#aSugg").hidden = !hits.length;
    };
    drawCat(); drawSugg();
    setTimeout(() => name.focus(), 60);
    name.addEventListener("input", () => { drawCat(); drawSugg(); });
    name.addEventListener("keydown", e => { if (e.key === "Enter" && name.value.trim()){ e.preventDefault(); note.focus(); } });
    $("#aSugg").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (!b) return; name.value = b.dataset.s; drawCat(); drawSugg(); note.focus(); });
    $("#aCat").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; picked = picked === b.dataset.c ? "" : b.dataset.c; drawCat(); });
    $("#aDone").addEventListener("click", closeSheet);
    $("#aForm").addEventListener("submit", async e => {
      e.preventDefault();
      // Stöd för "Mjölk, 2 st" direkt i namnfältet.
      const [n, ...rest] = name.value.split(",");
      if (!n.trim()) return name.focus();
      const extra = [rest.join(",").trim(), note.value.trim()].filter(Boolean).join(", ");
      const cat = picked || guessCat(n);
      name.value = ""; note.value = ""; picked = ""; drawCat(); drawSugg(); name.focus();
      if (await addItem(n, extra, cat)) toast(`${cap(n.trim())} på listan`);
    });
  });
}
$("#addOpen").addEventListener("click", openAdd);

function openItem(name){ return S.items.find(i => !i.done && norm(i.name) === norm(name)); }

async function addItem(name, note = "", cat = "", source = "manuell"){
  name = cap(name); if (!name || !db) return false;
  const existing = openItem(name);
  if (existing){
    if (note && !norm(existing.note).includes(norm(note))){
      await db.doc("items/" + existing.id).update({ note: existing.note ? existing.note + " + " + note : note }).catch(showErr);
    } else if (source === "manuell") toast(`${name} står redan på listan`);
    if (source === "manuell") countUse(name);
    return false;
  }
  if (source === "manuell") countUse(name);
  await db.collection("items").add({ name, note: note || "", cat: cat || guessCat(name), done: false,
    createdAt: Date.now(), doneAt: null, addedBy: me || null, addedByName: myName, source }).catch(showErr);
  return true;
}

async function toggleItem(id){
  const it = S.items.find(i => i.id === id); if (!it) return;
  await db.doc("items/" + id).update({ done: !it.done, doneAt: !it.done ? Date.now() : null }).catch(showErr);
}
async function removeItem(id){ await db.doc("items/" + id).delete().catch(showErr); }
async function clearDone(){
  const done = S.items.filter(i => i.done);
  for (const i of done){ try { await db.doc("items/" + i.id).delete(); } catch(e){ showErr(e); break; } }
  toast(`Rensade ${done.length} köpta varor`);
}

$("#shopList").addEventListener("click", e => {
  const row = e.target.closest("[data-id]"); if (!row) return;
  if (e.target.closest(".x")) removeItem(row.dataset.id);
  else if (e.target.closest(".tick, .txt")) toggleItem(row.dataset.id);
});
$("#shopList").addEventListener("click", e => { if (e.target.closest("#clearDone")) clearDone(); });

function itemRow(i){
  const who = i.addedByName || "";
  const meta = [i.note, i.source === "meny" ? "från veckomenyn" : "", who ? "lagt till av " + who : ""].filter(Boolean).join(" · ");
  return `<div class="item${i.done ? " done" : ""}" data-id="${esc(i.id)}">
    <button class="tick" aria-label="${i.done ? "Markera som ej köpt" : "Markera som köpt"}: ${esc(i.name)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <div class="txt"><div class="name">${esc(i.name)}</div>${meta ? `<div class="meta">${esc(meta)}</div>` : ""}</div>
    <button class="x" aria-label="Ta bort ${esc(i.name)}">×</button></div>`;
}

function renderShop(){
  const open = S.items.filter(i => !i.done).sort((a,b) => a.createdAt - b.createdAt);
  const done = S.items.filter(i => i.done).sort((a,b) => (b.doneAt||0) - (a.doneAt||0));
  let html = "";
  if (!open.length && !done.length){
    html = `<div class="empty"><strong>Listan är tom</strong>Tryck på "Lägg till vara" eller på ett snabbval. Allt ni lägger till syns direkt för er båda.</div>`;
  } else if (!open.length){
    html = `<div class="empty"><strong>Allt är handlat</strong>Inget kvar att köpa just nu.</div>`;
  }
  for (const [k, label] of CATS){
    const g = open.filter(i => (CATNAME[i.cat] ? i.cat : "ovrigt") === k);
    if (!g.length) continue;
    html += `<div class="group"><h3><span>${label}</span><span>${g.length}</span></h3><div class="list">${g.map(itemRow).join("")}</div></div>`;
  }
  if (done.length){
    html += `<div class="group"><h3><span>Köpt</span><button class="btn ghost small" id="clearDone" type="button">Rensa köpta (${done.length})</button></h3><div class="list">${done.slice(0,40).map(itemRow).join("")}</div></div>`;
  }
  $("#shopList").innerHTML = html;
  const b = $("#shopBadge"); b.hidden = !open.length; b.textContent = open.length;
  renderQuick();
}

/* ---------- Större köp ---------- */
const PEOPLE = [["emanuel","Emanuel"],["sofia","Sofia"],["leah","Leah"],["hemmet","Hemmet"]];
const PERSON = Object.fromEntries(PEOPLE);
try { const w = localStorage.getItem("kp-wishwho"); if (PERSON[w]) S.wishWho = w; } catch {}

$("#wishList").addEventListener("click", async e => {

function wishRow(w){
  const meta = [w.note, w.addedByName ? "tillagd av " + w.addedByName : ""].filter(Boolean).join(" · ");
  return `<div class="item${w.done ? " done" : ""}" data-id="${esc(w.id)}">
    <button class="tick" aria-label="${w.done ? "Markera som ej köpt" : "Markera som köpt"}: ${esc(w.name)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>

}
const sumPrice = ws => ws.reduce((a, w) => a + (w.price || 0), 0);
// w = null betyder ny sak. Arket stannar öppet efter "Lägg till" så att man kan fylla på flera.
function editWish(w){
  const isNew = !w;
  w = w || { name: "", note: "", price: null, who: S.wishFilter || S.wishWho };
  openSheet(`<h2>${isNew ? "Lägg till sak" : "Ändra"}</h2>
    <form class="stack" id="wForm">
      <div><label class="l" for="wName">Vad</label><input class="field" id="wName" value="${esc(w.name)}" placeholder="t.ex. Vinterskor" autocomplete="off" autocapitalize="sentences"${isNew ? "" : " required"}></div>

    </form>`, () => {

    $("#wWho").addEventListener("click", e => { const b = e.target.closest("[data-who]"); if (!b) return; who = b.dataset.who; for (const x of $("#wWho").children) x.setAttribute("aria-pressed", String(x.dataset.who === who)); });

    $("#wForm").addEventListener("submit", async e => {
      e.preventDefault();
      // Läs fälten innan arket stängs, annars finns de inte längre.
      const upd = { name: cap($("#wName").value), note: $("#wNote").value.trim(), price: toPrice($("#wPrice").value), who };
      if (!upd.name) return $("#wName").focus();
      if (isNew){
        S.wishWho = who; try { localStorage.setItem("kp-wishwho", who); } catch {}

/* Rätter som delar varor med veckans val, så att det blir mindre över */
// Bara varor man inte alltid har hemma räknas (nötfärs och fiskpinnar, inte pasta och ägg).
const dishKeys = d => new Set((d.ingredients || []).map(i => canonical(i.n)).filter(c => c.key && !isPantry(c.key)).map(c => c.key));
function weekPairs(){
  const chosen = new Set(), keys = new Map();
  for (const d of weekDates()){
    const day = S.days[keyOf(d)] || {};
    if (day.dinner && day.dinner.dishId) chosen.add(day.dinner.dishId);
  }
  for (const id of chosen){ const d = dishById(id); if (d) for (const k of dishKeys(d)) keys.set(k, canonical(k).name); }
  if (!keys.size) return new Map();
  const out = new Map();
  for (const d of S.dishes){
    if (chosen.has(d.id)) continue;
    const shared = [...dishKeys(d)].filter(k => keys.has(k));
    if (!shared.length) continue;
    // Dyrare varor väger tyngre: att dela nötfärs är värt mer än att dela en gurka.
    const score = shared.reduce((a, k) => a + ingredientCost({ n: keys.get(k) }).cost, 0);
    out.set(d.id, { shared: shared.map(k => keys.get(k)), score });
  }
  return out;
}
const topPairs = (pairs, n) => [...pairs].filter(([, p]) => p.score >= 15).sort((a, b) => b[1].score - a[1].score || dishTaste(dishById(b[0])) - dishTaste(dishById(a[0]))).slice(0, n);
function renderPairs(){
  const el = $("#pairs"), top = topPairs(weekPairs(), 3);
  const free = weekDates().map(keyOf).find(k => !(S.days[k] && S.days[k].dinner));
  el.hidden = !top.length || !free;
  if (el.hidden) return;
  el.innerHTML = `<h3>Passar ihop med veckans rätter</h3><div class="opts">` + top.map(([id, p]) => `<button type="button" data-pair="${esc(id)}"><span><b>${esc(dishById(id).name)}</b><small>Delar ${esc(p.shared.join(", ").toLowerCase())}</small></span><span class="add">+ Lägg till</span></button>`).join("") + `</div>`;
}

/* Att handla till veckan.
   Varje middag minns vilka av sina varor som redan är hanterade (tillagda eller bortrensade).
   En ny eller bytt middag har inga hanterade varor, så dess varor dyker upp som nya förslag. */
function weekIngredients(dates = weekDates()){
  const map = new Map();
  for (const d of dates){
    const k = keyOf(d), m = (S.days[k] || {}).dinner;
    // Speed dinner-varorna lades på listan när rätten valdes som reserv.
    if (!m || !m.dishId || m.speed) continue;
    const dish = dishById(m.dishId); if (!dish) continue;
    const done = m.handled || {};
    for (const ing of dish.ingredients || []){
      const c = canonical(ing.n);
      if (!c.key || isStaple(c.name) || isStaple(ing.n) || done[c.key]) continue;
      if (!map.has(c.key)) map.set(c.key, { key: c.key, name: c.name, amts: [], dishes: new Set(), days: new Set() });
      const e = map.get(c.key); if (ing.m) e.amts.push(ing.m); e.dishes.add(dish.name); e.days.add(k);
    }
  }
  // Summera samma vara: 400 g + 400 g blir 800 g.
  for (const e of map.values()) e.total = sumAmounts(e.amts);
  return [...map.values()].sort((a,b) => {
    const ca = CATS.findIndex(c => c[0] === guessCat(a.name)), cb = CATS.findIndex(c => c[0] === guessCat(b.name));
    return ca - cb || a.name.localeCompare(b.name, "sv");
  });
}
// Förslag = varor som inte är hanterade och inte redan står på listan.
const suggestions = dates => weekIngredients(dates).filter(e => !openItem(e.name));
const thisWeek = () => Array.from({length:7}, (_, i) => addDays(today0(), i));

// Markera varorna som hanterade på de middagar de kommer ifrån.
async function markHandled(entries){
  const byDay = new Map();
  for (const e of entries) for (const k of e.days){ if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(e.key); }
  const writes = [];
  for (const [k, keys] of byDay){
    const cur = S.days[k]; if (!cur || !cur.dinner) continue;
    const handled = { ...(cur.dinner.handled || {}) };
    for (const key of keys) handled[key] = true;
    S.days[k] = { ...cur, dinner: { ...cur.dinner, handled } };
    writes.push(db.doc("days/" + k).set(S.days[k]));
  }
  render();
  await Promise.all(writes).catch(showErr);
}

  const ds = S.dishes.filter(x => !q || norm(x.name).includes(q) || (x.ingredients||[]).some(i => norm(i.n).includes(q)));
  if (!S.dishes.length){
    $("#dishList").innerHTML = `<div class="empty"><strong>Inga rätter än</strong>Tryck på "Ny rätt" och skriv in en rätt ni brukar laga, med ingredienserna rad för rad.<div style="margin-top:12px"><button class="btn" data-seed="1" type="button">Lägg in ${SEED_DISHES.length} starträtter</button></div></div>`; return;
  }
  const by = { taste: x => -dishTaste(x), health: x => estimateKcal(x.ingredients).density || 1e9, cost: x => dishCost(x) || 1e9 }[S.dishSort];
  if (by) ds.sort((a, b) => by(a) - by(b) || a.name.localeCompare(b.name, "sv"));
  const missing = MORE_DISHES.filter(m => !S.dishes.some(x => x.id === m.id));
  const moreDone = S.meta && S.meta.seeds && S.meta.seeds.more;
  const moreBtn = missing.length && !moreDone ? `<div class="pairs" style="margin:0 0 12px"><h3>Fler rätter</h3><div class="spread"><span class="hint">${missing.length} vardagsrätter med vanliga ingredienser, till exempel ${esc(missing.slice(0, 3).map(m => m.name.toLowerCase()).join(", "))}.</span><button class="btn small" data-more="1" type="button">Lägg till ${missing.length} rätter</button></div></div>` : "";
  $("#dishList").innerHTML = moreBtn + `<div class="spread" style="margin:0 2px 8px"><span class="count">${ds.length} av ${S.dishes.length} rätter</span>
      <select class="sortsel" id="dishSort" aria-label="Sortera">${[["name","Sortera: Namn"],["taste","Godast först"],["health","Nyttigast först"],["cost","Billigast först"]].map(([k,n]) => `<option value="${k}"${(S.dishSort || "name") === k ? " selected" : ""}>${n}</option>`).join("")}</select></div>` +
    (ds.length ? `<div class="list">` + ds.map(x => `<div class="dish" data-dish="${esc(x.id)}"><div class="t"><div class="n">${esc(x.name)}${x.builtin ? "" : `<span class="tag">egen</span>`}</div><div class="i">${esc((x.ingredients||[]).map(i => i.m ? `${i.n} ${i.m}` : i.n).join(", ")) || "Inga ingredienser"}</div>
      <div class="rate"><span>Nyttig ${stars(dishHealth(x), "health")}${dishKcal(x) ? ` ${dishKcal(x)} kcal` : ""}</span><span>Gott ${stars(dishTaste(x), "taste")}</span></div></div><span class="price${dishCost(x) ? "" : " none"}">${dishCost(x) ? "≈ " + kr(dishCost(x)) : "inget pris"}</span></div>`).join("") + `</div>`
      : `<div class="empty">Ingen rätt matchar "${esc(S.search)}".</div>`);
}
$("#dishSearch").addEventListener("input", e => { S.search = e.target.value; renderDishes(); });
try { S.dishSort = localStorage.getItem("kp-dishsort") || "name"; } catch { S.dishSort = "name"; }
$("#dishList").addEventListener("change", e => { if (e.target.id !== "dishSort") return; S.dishSort = e.target.value; try { localStorage.setItem("kp-dishsort", S.dishSort); } catch {} renderDishes(); });
$("#newDish").addEventListener("click", () => editDish(null));
$("#dishList").addEventListener("click", async e => {
  const mb = e.target.closest("[data-more]");
  if (mb){
    mb.disabled = true;
    const b = writeBatch(fsRef);
    const missing = MORE_DISHES.filter(m => !S.dishes.some(x => x.id === m.id));
    for (const d of missing) b.set(doc(fsRef, "dishes", d.id), { name: d.name, ingredients: d.ingredients, builtin: true, updatedAt: Date.now() });
    b.set(doc(fsRef, "meta", "seeds"), { more: true, updatedAt: Date.now() });
    try { await b.commit(); toast(`${missing.length} nya rätter är inlagda`); } catch(err){ showErr(err); mb.disabled = false; }
    return;
  }
  const sb = e.target.closest("[data-seed]");
  if (sb){
    sb.disabled = true;
    const b = writeBatch(fsRef);
    for (const d of SEED_DISHES) b.set(doc(fsRef, "dishes", d.id), { name: d.name, ingredients: d.ingredients, cost: d.cost, builtin: true, updatedAt: Date.now() });
    try { await b.commit(); toast("Starträtterna är inlagda"); } catch(err){ showErr(err); sb.disabled = false; }
    return;
  }
});
$("#dishList").addEventListener("click", e => { const r = e.target.closest("[data-dish]"); if (r) editDish(r.dataset.dish); });

function editDish(id){
  const d = id ? dishById(id) : null;
  openSheet(`<h2>${d ? "Redigera rätt" : "Ny rätt"}</h2>
    <form class="stack" id="dishForm">
      <div><label class="l" for="dName">Namn</label><input class="field" style="width:100%" id="dName" value="${esc(d ? d.name : "")}" placeholder="t.ex. Kycklinggryta med ris" required></div>
      <div><label class="l" for="dIng">Ingredienser, en per rad</label>
        <textarea class="field" id="dIng" placeholder="Kycklingfilé, 600 g&#10;Ris, 4 port&#10;Gul lök&#10;Matlagningsgrädde, 2 dl">${esc(d ? ingToText(d.ingredients) : "")}</textarea>
        <div class="hint">Skriv mängden efter ett kommatecken om ni vill, t.ex. "Köttfärs, 500 g".</div></div>
      <div><label class="l" for="dCost">Ungefärlig kostnad för hela rätten (kr)</label><input class="field" style="width:100%" id="dCost" type="number" inputmode="numeric" min="0" step="1" value="${d && typeof d.cost === "number" ? d.cost : d && d.cost === undefined && SEED_COST[d.id] ? SEED_COST[d.id] : ""}" placeholder="Lämna tomt för att använda förslaget">
        <div class="est" id="dEst"></div></div>
      <div><span class="l">Hur gott tycker ni att det är?</span><div class="starpick" id="dTaste" role="group" aria-label="Betyg för hur gott">${[1,2,3,4,5].map(n => `<button type="button" data-t="${n}" aria-label="${n} av 5">★</button>`).join("")}</div></div>
      <div><span class="l">Nyttighet (räknas ut av appen)</span><div id="dHealth" class="hint"></div></div>
      <div class="spread">
        ${d ? `<button type="button" class="btn danger small" id="dDel">Ta bort rätten</button>` : "<span></span>"}
        <div class="row"><button type="button" class="btn ghost" id="dCancel">Avbryt</button><button class="btn" type="submit">Spara</button></div>
      </div>
    </form>`, () => {
    if (!d) $("#dName").focus();
    $("#dCancel").addEventListener("click", closeSheet);
    const drawEst = () => {
      const e = estimateDish(textToIng($("#dIng").value));
      if (!e.rows.length){ $("#dEst").innerHTML = `<div class="hint">Skriv in ingredienserna så föreslår appen ett pris.</div>`; return; }
      $("#dEst").innerHTML = `<div class="spread"><span class="hint">Förslag utifrån ingredienserna: <b>≈ ${kr(e.total)}</b>${e.unknown ? ` · ${e.unknown} gissade` : ""}</span>
        <button type="button" class="btn ghost small" id="dUseEst">Använd förslaget</button></div>
        <details><summary class="hint">Visa uträkningen</summary><div class="hint">${e.rows.map(r => `${esc(r.n)}${r.m ? " (" + esc(r.m) + ")" : ""}: ${r.known ? "" : "gissat "}${kr(r.cost)}`).join("<br>")}</div></details>`;
      $("#dUseEst").addEventListener("click", () => { $("#dCost").value = e.total; });
    };
    drawEst();
    let taste = dishTaste(d);
    const drawTaste = () => { for (const b of $("#dTaste").children) b.classList.toggle("on", Number(b.dataset.t) <= taste); };
    drawTaste();
    $("#dTaste").addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (!b) return; const n = Number(b.dataset.t); taste = taste === n ? 0 : n; drawTaste(); });
    const drawHealth = () => {
      const k = estimateKcal(textToIng($("#dIng").value));
      $("#dHealth").innerHTML = k.perPortion ? `${stars(healthStars(k.density), "health")} ≈ ${k.density} kcal per 100 g · ≈ ${k.perPortion} kcal per portion (4 portioner)${k.unknown ? ` · ${k.unknown} gissade` : ""}<br>Stjärnorna bygger på kcal per 100 g, så de beror inte på hur stort receptet är.` : "Skriv in ingredienserna så räknar appen ut det.";
    };
    drawHealth();
    $("#dIng").addEventListener("input", () => { drawEst(); drawHealth(); });
    $("#dishForm").addEventListener("submit", async e => {
      e.preventDefault();
      const body = { name: cap($("#dName").value), ingredients: textToIng($("#dIng").value), cost: toPrice($("#dCost").value), taste: taste || null, builtin: d ? !!d.builtin : false, updatedAt: Date.now() };
      if (!body.name) return;
      closeSheet();
      try { if (d) await db.doc("dishes/" + d.id).set(body); else await db.collection("dishes").add(body); toast("Rätten är sparad"); }
      catch(err){ showErr(err); }
    });
    const del = $("#dDel");
    if (del) del.addEventListener("click", async () => {
      if (del.dataset.armed){ closeSheet(); await db.doc("dishes/" + d.id).delete().catch(showErr); toast("Rätten är borttagen"); }
      else { del.dataset.armed = "1"; del.textContent = "Tryck igen för att ta bort"; }
    });
  });
}

/* ---------- Render ---------- */
function render(){
  setTimeout(ensureSpeed);
  renderShop();
  renderPlanBadge();
  if (S.sheetDraw) S.sheetDraw();
  if (S.view === "wish") renderWish();
  if (S.view === "plan") renderPlan();
  if (S.view === "dish") renderDishes();
}


/* ---------- Start ---------- */
try { const v = localStorage.getItem("kp-view"); if (v && TITLES[v]) S.view = v; } catch {}
setView(S.view);

function makeDb(fs){
  const wrap = s => ({ docs: s.docs.map(d => ({ id: d.id, data: () => d.data() })) });
  return {
    collection: p => ({ add: d => addDoc(collection(fs, p), d), onSnapshot: (n, e) => onSnapshot(collection(fs, p), s => n(wrap(s)), e) }),
    doc: p => ({ set: (d, o) => o ? setDoc(doc(fs, p), d, o) : setDoc(doc(fs, p), d), update: d => updateDoc(doc(fs, p), d), delete: () => deleteDoc(doc(fs, p)) }),
  };
}

if (!FIREBASE_CONFIG){
  $("#login").hidden = false; $("#loginBtn").hidden = true;
  $("#loginMsg").textContent = "Appen är inte kopplad till någon databas än. Fyll i config.js med Firebase-inställningarna.";
} else {
  const fbApp = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(fbApp);
  const provider = new GoogleAuthProvider();
  fsRef = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  let unsubs = [];
  $("#loginBtn").addEventListener("click", () => {
    signInWithPopup(auth, provider).catch(e => {
      if (["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)) signInWithRedirect(auth, provider);
      else if (e.code !== "auth/popup-closed-by-user") $("#loginMsg").textContent = "Inloggningen misslyckades (" + e.code + "). Försök igen.";
    });
  });
  $("#logoutBtn").addEventListener("click", () => signOut(auth));
  onAuthStateChanged(auth, u => {
    unsubs.forEach(f => f()); unsubs = [];
    $("#login").hidden = !!u; $("#app").hidden = !u; $("nav.tabs").hidden = !u;
    if (!u){ db = null; return; }
    me = u.uid; myName = (u.displayName || u.email || "").split(" ")[0];
    $("#whoAmI").textContent = "Inloggad som " + (u.email || u.displayName || "");
    db = makeDb(fsRef);
    let first = 0;
    const ready = () => { if (++first === 3) $("#syncState").textContent = "Synkad"; };
    const onErr = e => {
      console.error(e);
      if (e.code === "permission-denied"){
        $("#offline").hidden = false;
        $("#offline").textContent = `Kontot ${u.email} har inte tillgång till listan. Logga ut och välj ett annat konto, eller be den som satte upp appen att lägga till din adress.`;
      } else showErr(e);
      $("#syncState").textContent = "Frånkopplad";
    };
    unsubs.push(db.collection("items").onSnapshot(s => { S.items = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); ready(); }, onErr));
    unsubs.push(db.collection("dishes").onSnapshot(s => { S.dishes = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => a.name.localeCompare(b.name, "sv")); render(); ready(); }, onErr));
    unsubs.push(db.collection("meta").onSnapshot(s => { const o = {}; for (const d of s.docs) o[d.id] = d.data(); S.meta = o; S.metaLoaded = true; render(); }, onErr));
    unsubs.push(db.collection("weeks").onSnapshot(s => { const o = {}; for (const d of s.docs) o[d.id] = d.data(); S.weeks = o; render(); }, onErr));
    unsubs.push(db.collection("wishes").onSnapshot(s => { S.wishes = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, onErr));
    unsubs.push(db.collection("days").onSnapshot(s => { const o = {}; for (const d of s.docs) o[d.id] = d.data(); S.days = o; render(); ready(); }, onErr));
  });
}
})();
</script>

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
